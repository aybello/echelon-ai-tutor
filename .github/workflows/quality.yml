name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: echelon_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mailpit:
        image: axllent/mailpit:v1.31.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
          MP_DISABLE_VERSION_CHECK: "1"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify enforced dependency guardrails
        run: pnpm deps:verify-guardrails
      - name: Block moderate, high and critical production dependency advisories
        run: pnpm audit --prod --audit-level moderate
      - run: pnpm check
      - name: Type-check the coordinated UI review
        run: pnpm exec tsc --noEmit -p prototypes/ui-ux-preview/tsconfig.json
      - name: Validate exact OIT batch-release package
        run: node scripts/release-oit-question-banks.mjs
      - name: Validate governed Class IV exam releases
        run: node --test scripts/collectionReview.test.mjs scripts/export-wpi-class4-collection-review.test.mjs scripts/recovery/releaseWpiClass4Collection.test.mjs scripts/recovery/releaseWpiClass4Treatment.test.mjs
      - name: Validate Class III distribution repair content
        run: node scripts/recovery/verifyClass3DistributionRepair.mjs
      - name: Validate the complete governed 309A content package
        run: |
          pnpm 309a:validate:full
          pnpm 309a:validate-package
          pnpm 309a:import:dry-run
      - run: pnpm db:verify-migrations
      - name: Verify clean baseline and forward-only upgrade path
        shell: bash
        env:
          MIGRATION_APPROVED: APPLY_FORWARD_MIGRATIONS
          MIGRATION_BACKUP_CONFIRMED: BACKUP_VERIFIED
        run: |
          pnpm exec drizzle-kit export --dialect mysql --schema ./drizzle/schema.ts \
            | sed '/^Reading schema files:/d; /^\/.*schema.ts$/d' \
            > /tmp/echelon-baseline.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_ci \
            < /tmp/echelon-baseline.sql

          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_ci \
            pnpm db:verify-schema --strict

          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE echelon_upgrade_ci"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_upgrade_ci \
            < /tmp/echelon-baseline.sql

          # This disposable database is exported from current schema.ts, so every
          # post-baseline object exists before the guarded reset begins.
          # 0070 audit tables are absent from baseline 52. Drop their current
          # forms so 0070 recreates them and 0071 adds its columns exactly once.
          REHEARSAL_RESET_APPROVED=RESET_DISPOSABLE_REHEARSAL \
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:reset-forward-rehearsal
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:migrate:verify-baseline
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:migrate:adopt
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:migrate:apply
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:verify-schema --strict

          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE echelon_standalone_ci"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_standalone_ci \
            < /tmp/echelon-baseline.sql
          # Same current-schema export precondition as the full-forward rehearsal.
          # 0070 audit tables are absent from baseline 52 and must replay cleanly.
          REHEARSAL_RESET_APPROVED=RESET_DISPOSABLE_REHEARSAL \
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:reset-forward-rehearsal
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:migrate:verify-baseline
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:migrate:adopt
          MIGRATION_APPROVED=APPLY_APPROVED_STANDALONE_MIGRATION \
          MIGRATION_BACKUP_CONFIRMED=BACKUP_VERIFIED \
          MIGRATION_TARGET=0062_purchase_email_outbox \
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:migrate:apply-standalone
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT tag, status FROM echelon_standalone_ci.echelon_schema_migrations WHERE version = 62" \
            | grep -Ex "^0062_purchase_email_outbox[[:space:]]+applied$"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM echelon_standalone_ci.echelon_schema_migrations WHERE version IN (59, 60, 61)" \
            | grep -Fx "0"
          MIGRATION_APPROVED=APPLY_APPROVED_STANDALONE_MIGRATION \
          MIGRATION_BACKUP_CONFIRMED=BACKUP_VERIFIED \
          MIGRATION_TARGET=0066_exam_dates_unique \
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:migrate:apply-standalone
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT tag, status FROM echelon_standalone_ci.echelon_schema_migrations WHERE version = 66" \
            | grep -Ex "^0066_exam_dates_unique[[:space:]]+applied$"
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_standalone_ci \
            pnpm db:migrate:status
      - name: Deterministic unit and acceptance tests
        run: >-
          pnpm exec vitest run --maxWorkers 2 --minWorkers 1
          --exclude '**/*.integration.test.ts'
          --exclude server/_core/access.test.ts
          --exclude server/accessService.test.ts
          --exclude server/emailOtp.test.ts
          --exclude server/ki001.otp.test.ts
          --exclude server/purchase.flow.test.ts
          --exclude server/subscription.flow.test.ts
          --exclude server/org.teams.test.ts
          --exclude server/quiz.serverScoring.test.ts
          --exclude server/exam.submitMock.test.ts
          --exclude server/stripe/individualExamPass.test.ts
          --exclude server/stripe/validateOneTimeCheckout.test.ts
          --exclude server/stripe/webhook.handler.test.ts
          --exclude server/webhook.integration.test.ts
          --exclude server/flashcardReliability.integration.test.ts
          --exclude server/trainingRouter.integration.test.ts
          --exclude server/learnerReliability.integration.test.ts
          --exclude server/wpiBlueprintRelease.integration.test.ts
          --exclude server/courseReporting.integration.test.ts
          --exclude server/practicePaging.integration.test.ts
          --exclude server/learnerBankModules.integration.test.ts
          --exclude server/billingJobs.integration.test.ts
          --exclude server/examDateRecords.integration.test.ts
          --exclude server/ceuLearning.integration.test.ts
          --exclude server/blogWorkflow.integration.test.ts
          --exclude server/jobBoardReliability.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASS: test-only-placeholder
      - name: Database-backed access, OTP and Stripe lifecycle tests
        run: >-
          pnpm exec vitest run --maxWorkers 2 --minWorkers 1
          server/_core/access.test.ts
          server/accessService.test.ts
          server/emailOtp.test.ts
          server/ki001.otp.test.ts
          server/purchase.flow.test.ts
          server/subscription.flow.test.ts
          server/org.teams.test.ts
          server/quiz.serverScoring.test.ts
          server/exam.submitMock.test.ts
          server/stripe/individualExamPass.test.ts
          server/stripe/validateOneTimeCheckout.test.ts
          server/stripe/webhook.handler.test.ts
          server/webhook.integration.test.ts
          server/flashcardReliability.integration.test.ts
          server/trainingRouter.integration.test.ts
          server/learnerReliability.integration.test.ts
          server/wpiBlueprintRelease.integration.test.ts
          server/billingJobs.integration.test.ts
          server/examDateRecords.integration.test.ts
          server/teamFlexLifecycle.integration.test.ts
          server/class1NetworksImporter.integration.test.ts
          server/class1NetworksRelease.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          REQUIRE_WEBHOOK_INTEGRATION_DB: "1"
          ECHELON_RUN_ISOLATED_INTEGRATION_TESTS: "true"
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      - name: Database-backed CEU self-paced completion
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/ceuLearning.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          CEU_INTEGRATION_TEST_DB: "1"
      - name: Database-backed durable blog recovery and atomic publication
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/blogWorkflow.integration.test.ts
        env:
          CI: "1"
          NODE_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          BLOG_INTEGRATION_TEST_DB: "1"
      - name: Database-backed audit auth, payment, Teams and partnership invariants
        run: >-
          pnpm exec vitest run --maxWorkers 2 --minWorkers 1
          server/auth.atomicVerification.integration.test.ts
          server/stripe/paymentInvariant.integration.test.ts
          server/teams/auditTeams.integration.test.ts
          server/teams/auditBillingScope.integration.test.ts
          server/partnershipInquiry.integration.test.ts
        env:
          CI: "1"
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          AUDIT_INTEGRATION_TEST_DB: "1"
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      - name: Database-backed Jobs state, vacancy filters and concurrent ownership
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/jobBoardReliability.integration.test.ts
        env:
          CI: "1"
          NODE_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          AUDIT_INTEGRATION_TEST_DB: "1"
      - name: Database-backed OIT import and batch release
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/oitImporter.integration.test.ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          REQUIRE_OIT_IMPORTER_DB: "1"
      - name: Database-backed learner and manager course reporting
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/courseReporting.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
      - name: Database-backed practice paging, module filters and mock retirement
        run: pnpm exec vitest run --maxWorkers 2 --minWorkers 1 server/practicePaging.integration.test.ts server/learnerBankModules.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
      - name: Verify clean tracked release and exported source archive identity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          export SOURCE_FINGERPRINT_TOOL="$GITHUB_WORKSPACE/scripts/sourceFingerprint.ts"
          export EXPECTED_SOURCE="$(pnpm exec tsx -e 'import(process.env.SOURCE_FINGERPRINT_TOOL).then(({computeSourceFingerprint}) => console.log(computeSourceFingerprint()))')"
          archive="$(mktemp -d "$RUNNER_TEMP/echelon-source.XXXXXX")"
          trap 'rm -rf "$archive"' EXIT
          git archive HEAD | tar -x -C "$archive"
          export RELEASE_VERIFIER="$GITHUB_WORKSPACE/scripts/buildServer.ts"
          cd "$archive"
          # Managed publishing receives committed source only, with no .git or
          # out-of-band release.json. Do not manufacture evidence absent there.
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" -e 'import(process.env.RELEASE_VERIFIER).then(({buildReleaseIdentity}) => { const identity = buildReleaseIdentity(); if (identity.releaseKind !== "source-sha256" || identity.release !== process.env.EXPECTED_SOURCE) throw Error("Managed archive functional source identity mismatch"); })'
      - name: Build the exact clean tracked checkout (not a labelled development artifact)
        run: pnpm build
        env:
          NODE_ENV: development
          JWT_SECRET: test-only-not-for-production
          VITE_APP_ID: echelon-browser-test
          VITE_OAUTH_PORTAL_URL: https://oauth.echelon.test
          VITE_ANALYTICS_ENDPOINT: https://analytics.example.test
          VITE_ANALYTICS_WEBSITE_ID: 11111111-1111-4111-8111-111111111111
      - name: Seed the Teams Course Pass browser journey
        run: node scripts/e2e/seedTeamsCoursePass.mjs
        env:
          CI: "1"
          NODE_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
      - name: Install the Teams browser-test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser-test Teams access, purchase confirmation, Equipment Lab and Process Guide
        run: pnpm exec playwright test e2e/teams-course-pass.spec.ts e2e/equipment-lab-three.spec.ts e2e/process-guide-three.spec.ts e2e/logout.spec.ts e2e/purchase-confirmation.spec.ts e2e/ceu-learning.spec.ts e2e/audit-repairs.spec.ts e2e/quiz-screen-fit.spec.ts e2e/course-chunk-recovery.spec.ts
        env:
          CI: "1"
          NODE_ENV: test
          PORT: "3000"
          APP_BASE_URL: http://127.0.0.1:3000
          E2E_BASE_URL: http://127.0.0.1:3000
          VITE_ANALYTICS_ENDPOINT: https://analytics.example.test
          VITE_ANALYTICS_WEBSITE_ID: 11111111-1111-4111-8111-111111111111
          MAILPIT_URL: http://127.0.0.1:8025
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_USER: e2e@echelon.test
          SMTP_PASS: test-only-placeholder
      - name: Browser-test the approved workspaces and offline review
        run: |
          node prototypes/ui-ux-preview/build-single-file.mjs /tmp/echelon-ui-preview.html
          pnpm exec playwright test --config prototypes/ui-ux-preview/playwright.config.ts
        env:
          CI: "1"
          UI_PREVIEW_HTML: /tmp/echelon-ui-preview.html
      - name: Upload Teams browser-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teams-course-pass-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: echelon_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block high and critical production dependency advisories
        run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - name: Validate the complete governed 309A content package
        run: |
          pnpm 309a:validate:full
          pnpm 309a:validate-package
          pnpm 309a:import:dry-run
      - run: pnpm db:verify-migrations
      - name: Verify clean baseline and forward-only upgrade path
        shell: bash
        env:
          MIGRATION_APPROVED: APPLY_FORWARD_MIGRATIONS
          MIGRATION_BACKUP_CONFIRMED: BACKUP_VERIFIED
        run: |
          pnpm exec drizzle-kit export --dialect mysql --schema ./drizzle/schema.ts \
            | sed '/^Reading schema files:/d; /^\/.*schema.ts$/d' \
            > /tmp/echelon-baseline.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_ci \
            < /tmp/echelon-baseline.sql

          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_ci \
            pnpm db:verify-schema --strict

          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE echelon_upgrade_ci"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_upgrade_ci \
            < /tmp/echelon-baseline.sql

          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:migrate:adopt
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot echelon_upgrade_ci \
            -e "DROP INDEX stripe_event_log_status_idx ON stripe_event_log; DROP INDEX team_flex_orders_org_status_idx ON team_flex_orders; DROP TABLE certification_content_reviews, certification_import_runs, certification_flashcards, certification_module_notes, certification_diagrams, certification_questions, certification_blueprint_tasks, certification_sources, certification_bank_versions;"
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:migrate:apply
          DATABASE_URL=mysql://root:root@127.0.0.1:3306/echelon_upgrade_ci \
            pnpm db:verify-schema --strict
      - name: Deterministic unit and acceptance tests
        run: >-
          pnpm exec vitest run
          server/product.acceptance.test.ts
          server/products.audit.test.ts
          server/courseRegistry.test.ts
          server/access.bankkey.test.ts
          server/mockExamScore.test.ts
          server/guideRegistry.test.ts
          server/blog.router.test.ts
          server/blog.content-2026.test.ts
          server/readiness.test.ts
          server/teams/flexBulkOnboarding.test.ts
          shared/teamPricing.test.ts
          server/trpcRateLimit.test.ts
          server/previewDiagnostic.test.ts
          server/migrationSafety.test.ts
          server/seoGeo.test.ts
          server/changelog.test.ts
          server/questionGovernance.test.ts
          server/certificationPrograms.test.ts
          server/electricianStandardCourse.test.ts
          server/electrician309aBlueprint.test.ts
          server/electrician309aQuestions.test.ts
          server/tutor.chat.test.ts
          server/aiTutorPolicy.test.ts
          client/src/hooks/useQuizSession.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
      - name: Database-backed access, OTP and Stripe lifecycle tests
        run: >-
          pnpm exec vitest run
          server/_core/access.test.ts
          server/accessService.test.ts
          server/emailOtp.test.ts
          server/ki001.otp.test.ts
          server/purchase.flow.test.ts
          server/subscription.flow.test.ts
          server/org.teams.test.ts
          server/quiz.serverScoring.test.ts
          server/exam.submitMock.test.ts
          server/stripe/individualExamPass.test.ts
          server/stripe/validateOneTimeCheckout.test.ts
          server/stripe/webhook.handler.test.ts
          server/webhook.integration.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-not-for-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/echelon_ci
          REQUIRE_WEBHOOK_INTEGRATION_DB: "1"
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      - run: pnpm build
        env:
          NODE_ENV: development
          JWT_SECRET: test-only-not-for-production
